[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "filemaker-patchwork"
dynamic = ["version"]
description = "Let your AI agent edit FileMaker: fields, scripts, value lists, layouts and themes, checked and reversible. MCP server for Claude Code, Cursor, Codex and Antigravity."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abdeltoto" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["filemaker", "claris", "fmupgradetool", "fmp12", "mcp", "mcp-server", "ai-agents", "claude-code", "cursor", "codex", "antigravity", "low-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
# Pillow 13 fixes known vulnerabilities but needs Python 3.11; 12.3 is the newest release for 3.10.
image = ["Pillow>=13; python_version >= '3.11'", "Pillow>=12.3; python_version < '3.11'"]

[project.scripts]
patchwork = "patchwork.cli:main"
filemaker-patchwork = "patchwork.cli:main"

[project.urls]
Homepage = "https://github.com/Abdeltoto/patchwork-filemaker-mcp"
Issues = "https://github.com/Abdeltoto/patchwork-filemaker-mcp/issues"
Changelog = "https://github.com/Abdeltoto/patchwork-filemaker-mcp/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "patchwork.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchwork = ["templates/*", "skills/*/SKILL.md"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# ruff format keeps lines to 120; the longer ones left are regexes and XML templates it does not split.
ignore = ["E501"]

[tool.coverage.run]
branch = true
source_pkgs = ["patchwork"]

[tool.mypy]
python_version = "3.10"
files = ["src"]

[[tool.mypy.overrides]]
# Pillow is the optional "image" extra.
module = ["PIL", "PIL.*"]
ignore_missing_imports = true

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # Same versions as .pre-commit-config.yaml; dev tools only, not package dependencies.
      - run: pip install ruff==0.17.5 mypy==2.4.1
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Secrets in the whole history (gitleaks)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner
      - run: pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Known vulnerabilities in what the package installs (pip-audit)
        run: |
          python -m venv /tmp/app
          /tmp/app/bin/pip install ".[image]"
          /tmp/app/bin/pip freeze --exclude filemaker-patchwork > /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt
      # The five low-severity findings are false positives (variable names, the subprocess import).
      - name: Static security analysis (bandit, medium severity and above)
        run: bandit -r src --severity-level medium

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[image]" coverage==7.17.3
      - run: coverage run -m unittest discover -s tests
      - run: coverage report -m
      # cli, mcp, project and __main__ are the interfaces; they are measured above but not gated.
      - name: Business logic coverage, blocking below 90%
        run: coverage report --include="src/patchwork/ops.py,src/patchwork/workspace.py,src/patchwork/tools.py,src/patchwork/build.py,src/patchwork/objects.py,src/patchwork/script.py,src/patchwork/place.py,src/patchwork/uses.py,src/patchwork/export.py,src/patchwork/rebrand.py" --fail-under=90

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[image]"
      - run: python -m unittest discover -s tests -v
      - run: patchwork --version
      - run: patchwork --help
      - run: patchwork init ci-project && patchwork mcp < /dev/null
        shell: bash
